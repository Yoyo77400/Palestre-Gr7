name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: No async
        run: |
          if cargo tree --workspace | grep -E '(tokio|futures|async-std)[a-z_-]* v'; then
            echo "::error::async runtime dependency detected"; exit 1
          fi
          if grep -rnE 'async (fn|move|\{)|\.await' crates/; then
            echo "::error::async code detected"; exit 1
          fi